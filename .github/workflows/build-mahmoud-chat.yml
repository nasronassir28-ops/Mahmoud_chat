# ملف واحد يبني تطبيق Mahmoud chat لأندرويد (إشعارات + مكالمات + إصلاح سماعة الأذن)
# قبل التشغيل ارفع إلى جذر المستودع: google-services.json و index.html و icon-192.png
# الاستخدام: Actions ثم Build Mahmoud Chat APK ثم Run workflow
name: Build Mahmoud Chat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in index.html icon-192.png; do
            [ -f "$f" ] || { echo "::error::الملف $f غير موجود في جذر المستودع. ارفعه ثم أعد التشغيل"; exit 1; }
          done
          GS="$(ls google-services*.json 2>/dev/null | head -n 1)"
          [ -n "$GS" ] || { echo "::error::لم أجد ملف google-services في جذر المستودع. ارفعه ثم أعد التشغيل"; exit 1; }
          echo "سيُستخدم ملف Firebase: $GS"

      - name: Unpack project from this file
        run: |
          WF="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          WF="${WF%%@*}"
          grep -q '^#DATA-END' "$WF" || { echo "::error::الملف ناقص: لم يصل النسخ حتى آخره. أعد لصق الملف كاملاً ثم احفظ"; exit 1; }
          sed -n 's/^#DATA //p' "$WF" | tr -d '\n' | base64 -d > project.tar.gz || { echo "::error::محتوى الملف تالف أو ناقص. أعد النسخ واللصق كاملاً"; exit 1; }
          echo "48967ecdae6c31d4e8537fbcff8f2929d7e47e614ceed022036a0a0cab6eaf95  project.tar.gz" | sha256sum -c - || { echo "::error::محتوى الملف تالف أو ناقص. أعد النسخ واللصق كاملاً"; exit 1; }
          tar xzf project.tar.gz
          rm project.tar.gz

      - name: Add web files and Firebase config
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html icon-192.png app/src/main/assets/www/
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest app/src/main/assets/www/; fi
          GS="$(ls google-services*.json | head -n 1)"
          cp "$GS" app/google-services.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d = json.load(open('app/google-services.json'))
          names = [c['client_info']['android_client_info']['package_name'] for c in d['client']]
          print('APP_ID=' + ('com.mahmoud.chat' if 'com.mahmoud.chat' in names else names[0]))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MahmoudChat-apk
          path: app/build/outputs/apk/debug/*.apk

