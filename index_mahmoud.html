<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mahmoud chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fa; --surface: #ffffff; --surface2: #eef1f6; --ink: #101828; --muted: #667085; --line: #e6eaf0;
    --p: #14b8a6; --p2: #0ea5e9; --grad: linear-gradient(135deg, #14b8a6 0%, #0ea5e9 100%);
    --other: #eef1f6; --otherText: #101828; --chatbg: #f6f8fb; --shadow: 0 1px 3px rgba(16,24,40,.08);
    --danger: #e5484d; --tint: rgba(20,184,166,.12); --badge: 70px;
  }
  [data-theme=dark] {
    --bg: #0a101c; --surface: #121a2b; --surface2: #1b2640; --ink: #e8edf6; --muted: #8fa0bd; --line: #223049;
    --other: #1e2a45; --otherText: #e8edf6; --chatbg: #0d1525; --shadow: none; --tint: rgba(20,184,166,.2);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: 'Tajawal', system-ui, 'Segoe UI', Tahoma, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  button, input, textarea { font-family: inherit; color: inherit; }
  svg { display: block; }
  #app { height: 100dvh; max-width: 760px; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; position: relative; overflow: hidden; }
  @media (min-width: 780px) { #app { box-shadow: 0 0 40px rgba(16,24,40,.15); } }
  .screen { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .splash { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--surface); }

  /* header */
  header.top { background: var(--surface); padding: 8px 10px; padding-top: calc(8px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 6px; flex-shrink: 0; border-bottom: 1px solid var(--line); min-height: 58px; }
  header.top .htitle { flex: 1; font-size: 19px; font-weight: 800; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
  .brand { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ib { background: none; border: 0; color: var(--ink); width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }
  .ib:active { background: var(--surface2); }
  .ib.acc { color: var(--p); background: var(--tint); }
  .ib.acc:active { background: var(--surface2); }
  .hbtn { background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-shrink: 0; }
  header.top input.sinput { flex: 1; min-width: 0; background: var(--surface2); border: 0; border-radius: 22px; padding: 10px 16px; font-size: 16px; outline: none; }
  header.top input.sinput::placeholder { color: var(--muted); }
  .avatar { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 20px; flex-shrink: 0; overflow: hidden; }
  .avatar img, .bigav img { width: 100%; height: 100%; object-fit: cover; display: block; }
  header.top .avatar { width: 38px; height: 38px; font-size: 16px; }

  /* lists */
  .list { flex: 1; overflow-y: auto; }
  .searchbar { margin: 10px 12px 4px; background: var(--surface2); border-radius: 22px; padding: 11px 16px; display: flex; gap: 10px; align-items: center; color: var(--muted); cursor: pointer; font-size: 15px; }
  .row { display: flex; align-items: center; gap: 13px; padding: 11px 14px; cursor: pointer; background: var(--bg); }
  .row:active { background: var(--surface2); }
  .row .info { flex: 1; min-width: 0; }
  .row .name { font-weight: 700; font-size: 16px; }
  .row .sub { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .row .sub.bold { font-weight: 700; color: var(--ink); }
  .row .meta { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .row .time.hot { color: var(--p); font-weight: 700; }
  .badge { background: var(--grad); color: #fff; border-radius: 12px; min-width: 22px; text-align: center; padding: 1px 7px; font-size: 12px; font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 40px 28px; line-height: 1.9; }
  .empty .ill { width: 150px; height: auto; margin: 0 auto 8px; }
  .ill .b { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
  .fab { position: absolute; bottom: calc(24px + var(--badge)); inset-inline-end: 20px; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--grad); color: #fff; box-shadow: 0 8px 20px rgba(14,165,233,.4); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .fab:active { transform: scale(.94); }

  /* chat */
  .msgs { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--chatbg); }
  .more { align-self: center; border: 0; background: var(--surface); color: var(--p); border-radius: 18px; padding: 7px 16px; font-size: 13px; cursor: pointer; box-shadow: var(--shadow); margin-bottom: 6px; }
  .empty-chat { margin: auto; text-align: center; color: var(--muted); line-height: 1.8; }
  .empty-chat .ill { width: 130px; height: auto; margin: 0 auto; }
  .bubble { max-width: 78%; padding: 8px 13px 6px; border-radius: 20px; font-size: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; position: relative; user-select: text; }
  .bubble.mine { align-self: flex-start; background: var(--grad); color: #fff; border-end-start-radius: 6px; }
  .bubble.other { align-self: flex-end; background: var(--other); color: var(--otherText); border-end-end-radius: 6px; }
  .bubble.big { background: none !important; font-size: 46px; padding: 0 4px; line-height: 1.2; }
  .bubble.deleted { background: transparent !important; border: 1px dashed var(--line); color: var(--muted) !important; font-style: italic; }
  .bubble .t { font-size: 10.5px; opacity: .8; display: flex; align-items: center; gap: 4px; margin-top: 2px; white-space: normal; }
  .tk2 { display: inline-flex; }
  .tk2 svg + svg { margin-inline-start: -8px; }
  .bubble .mimg { max-width: 100%; max-height: 320px; border-radius: 14px; display: block; margin-bottom: 4px; cursor: zoom-in; }
  .bubble.vid { max-width: 92%; }
  .vwrap { position: relative; width: min(84vw, 400px); border-radius: 14px; overflow: hidden; background: #000; margin-bottom: 4px; }
  .vwrap video { display: block; width: 100%; height: 62vh; max-height: 78vh; object-fit: contain; background: #000; }
  .vph { height: 62vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #fff; cursor: pointer; background: linear-gradient(135deg, #0f172a, #1e293b); }
  .vph .pbtn { width: 62px; height: 62px; border-radius: 50%; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; }
  .vph .vsz { font-size: 13px; opacity: .85; }
  .vfs { position: absolute; top: 8px; inset-inline-end: 8px; border: 0; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .avwrap { position: relative; flex-shrink: 0; display: flex; }
  .pdot { position: absolute; bottom: 1px; inset-inline-end: 1px; width: 13px; height: 13px; border-radius: 50%; background: #22c55e; border: 2px solid var(--surface, #fff); display: none; }
  .pdot.on { display: block; }
  header.top .pdot { width: 11px; height: 11px; bottom: 0; inset-inline-end: 0; }
  .hsub.onl { color: #16a34a; font-weight: 700; }
  .fcard { display: flex; align-items: center; gap: 10px; background: rgba(127,127,127,.16); border-radius: 14px; padding: 9px 10px; cursor: pointer; min-width: 190px; margin-bottom: 3px; white-space: normal; }
  .ficon { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.28); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .finfo { min-width: 0; }
  .fname { font-weight: 700; font-size: 14px; word-break: break-all; }
  .fsize { font-size: 12px; opacity: .8; }
  .blockbar { display: none; padding: 16px; text-align: center; background: var(--surface); border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; flex-direction: column; gap: 10px; padding-bottom: calc(16px + var(--badge)); }
  .composer { display: flex; align-items: flex-end; gap: 4px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom) + var(--badge)); background: var(--surface); border-top: 1px solid var(--line); flex-shrink: 0; }
  .cb { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--p); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; flex-shrink: 0; padding: 0; }
  .cb:active { background: var(--tint); }
  .cb input, .pick input, .opt input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; font-size: 0; margin: 0; }
  .pill { flex: 1; background: var(--surface2); border-radius: 22px; display: flex; align-items: flex-end; min-width: 0; }
  .pill textarea { flex: 1; border: 0; background: none; outline: none; resize: none; font-size: 16px; padding: 10px 14px; max-height: 120px; line-height: 1.4; min-width: 0; }
  .pill textarea::placeholder { color: var(--muted); }
  .composer.typing .extra { display: none; }
  .sendbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--p); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0; }
  .sendbtn svg { transform: scaleX(-1); }
  .sendbtn.like svg { transform: none; }

  /* sheets, dialogs, banner, toast */
  .sheet-back { position: fixed; inset: 0; background: rgba(8,12,24,.5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet-back.mid { align-items: center; padding: 20px; }
  .sheet { background: var(--surface); width: 100%; max-width: 760px; border-radius: 24px 24px 0 0; padding: 16px 14px calc(18px + env(safe-area-inset-bottom)); }
  .sheet.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 20px 16px calc(22px + env(safe-area-inset-bottom)); }
  .opt { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 4px; border-radius: 18px; background: var(--surface2); font-size: 14px; font-weight: 500; cursor: pointer; color: var(--ink); }
  .opt .oi { color: var(--p); }
  .act { width: 100%; display: flex; align-items: center; gap: 14px; padding: 15px 12px; border: 0; background: none; font-size: 16px; cursor: pointer; border-radius: 14px; text-align: start; }
  .act:active { background: var(--surface2); }
  .act.danger { color: var(--danger); }
  .dlg { background: var(--surface); border-radius: 22px; padding: 22px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; max-height: 88vh; overflow-y: auto; }
  .dlg h3 { margin: 0; font-size: 19px; }
  .dlg p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; }
  .dlg input { padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 16px; outline: none; background: var(--bg); }
  .dlg textarea { padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 16px; outline: none; background: var(--bg); color: inherit; font-family: inherit; min-height: 96px; resize: vertical; }
  .bubble .t .ed { font-style: italic; }
  .diag { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.6; }
  .diag .ok { color: #16a34a; } .diag .no { color: var(--danger); }
  .banner { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -140%); width: min(92%, 560px); background: var(--surface); color: var(--ink); border-radius: 18px; box-shadow: 0 10px 30px rgba(16,24,40,.28); padding: 10px 12px; display: flex; gap: 10px; align-items: center; z-index: 60; cursor: pointer; transition: transform .3s; border: 1px solid var(--line); }
  .banner.on { transform: translate(-50%, 0); }
  .banner .bt { min-width: 0; flex: 1; }
  .banner .bn { font-weight: 700; font-size: 15px; }
  .banner .bm { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast { position: fixed; bottom: calc(96px + var(--badge)); left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(16,24,40,.94); color: #fff; padding: 11px 18px; border-radius: 22px; font-size: 14px; z-index: 70; opacity: 0; pointer-events: none; transition: .25s; max-width: 88%; text-align: center; line-height: 1.6; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* viewer */
  .viewer { position: fixed; inset: 0; background: rgba(2,6,23,.96); z-index: 30; display: flex; flex-direction: column; color: #fff; }
  .viewer .ib { color: #fff; }
  .vhead { display: flex; align-items: center; gap: 10px; padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top)); }
  .vtitle { flex: 1; font-weight: 700; word-break: break-all; font-size: 15px; }
  .vbody { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; }
  .vbody img, .vbody video { max-width: 100%; max-height: 100%; border-radius: 10px; }
  .vbody audio { width: 90%; }
  .vfile { text-align: center; font-size: 15px; line-height: 2; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .vinfo { text-align: center; font-size: 13px; color: #94a3b8; min-height: 20px; padding: 0 12px; }
  .vfoot { display: flex; gap: 10px; padding: 12px 12px calc(14px + env(safe-area-inset-bottom)); }
  .vbtn { flex: 1; border: 0; border-radius: 14px; padding: 13px; font-size: 16px; font-weight: 700; background: #fff; color: #101828; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

  /* calls */
  .callscreen, .incoming { position: fixed; inset: 0; z-index: 50; background: linear-gradient(160deg, #0b1220, #1e3a5f 58%, #0f766e); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: calc(48px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom)); overflow: hidden; }
  .callscreen .rv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none; }
  .callscreen.hasremote .rv { opacity: 1; }
  .callscreen.hasremote .cinfo .bigav { display: none; }
  .cinfo { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
  .cname { font-size: 27px; font-weight: 700; }
  .cstatus { font-size: 16px; opacity: .92; }
  .cinfo.ringing .bigav { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.45); } 70% { box-shadow: 0 0 0 26px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
  .lv { position: absolute; top: calc(14px + env(safe-area-inset-top)); inset-inline-start: 14px; width: 96px; height: 132px; object-fit: cover; border-radius: 14px; border: 2px solid rgba(255,255,255,.7); background: #000; display: none; z-index: 2; transform: scaleX(-1); }
  .callscreen.video .lv { display: block; }
  .cbar { position: relative; z-index: 1; display: flex; gap: 24px; align-items: center; }
  .cc { width: 64px; height: 64px; border-radius: 50%; border: 0; background: rgba(255,255,255,.2); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .cc.end { background: #ef4444; }
  .cc.end svg { transform: rotate(135deg); }
  .cc.accept { background: #22c55e; }
  /* أزرار المكالمة: صغيرة وعصرية وتتسع لأي عرض شاشة */
  .callscreen .cbar { gap: 12px; padding: 10px 14px; border-radius: 40px; background: rgba(15,23,42,.38); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 8px 28px rgba(0,0,0,.35); max-width: calc(100vw - 24px); box-sizing: border-box; flex-wrap: nowrap; }
  .callscreen .cbar .cc { width: 48px; height: 48px; flex: 0 0 auto; background: rgba(255,255,255,.16); transition: transform .12s ease, background .2s ease; }
  .callscreen .cbar .cc:active { transform: scale(.92); }
  .callscreen .cbar .cc svg { width: 22px; height: 22px; }
  .callscreen .cbar .cc.on { background: #fff; color: #0b1220; }
  .callscreen .cbar .cc.end { background: #ef4444; width: 54px; height: 54px; }
  @media (max-width: 340px) { .callscreen .cbar { gap: 8px; padding: 8px 10px; } .callscreen .cbar .cc { width: 42px; height: 42px; } .callscreen .cbar .cc.end { width: 46px; height: 46px; } }

  /* auth */
  .ytsr { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow-y: auto; margin: 0 -4px; }
  .ytres { display: flex; gap: 10px; align-items: center; padding: 6px 4px; border: 0; background: transparent; color: var(--ink); text-align: right; cursor: pointer; border-radius: 12px; width: 100%; font-family: inherit; }
  .ytres:active { background: var(--surface2); }
  .ytres img { width: 112px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; background: var(--surface2); flex: none; }
  .ytres .tt { font-size: 14px; font-weight: 700; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ytres .ch { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ytmsg { text-align: center; color: var(--muted); font-size: 14px; padding: 10px 0; line-height: 1.7; }
  .ytsrow { display: flex; gap: 8px; }
  .ytsrow input { flex: 1; min-width: 0; }
  .ytsrow .btn { width: auto; padding: 0 18px; }
  .ytpane { position: absolute; top: 0; left: 0; right: 0; z-index: 3; background: #000; padding-top: env(safe-area-inset-top); box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  .ytbox { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .ytbox iframe, .ytbox > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .ytbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; background: #111827; color: #fff; font-size: 13px; font-weight: 700; }
  .ytbtns { display: flex; gap: 6px; }
  .ytbar button { border: 0; border-radius: 14px; padding: 7px 12px; font-size: 13px; font-weight: 700; cursor: pointer; background: rgba(255,255,255,.16); color: #fff; }
  .ytbar button.stop { background: #ef4444; }
  .callscreen.watching .lv { top: calc(278px + env(safe-area-inset-top)); }
  .callscreen .cbar.six { gap: 8px; padding: 8px 10px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
  .callscreen .cbar.six .cc { width: 42px; height: 42px; }
  .callscreen .cbar.six .cc svg { width: 20px; height: 20px; }
  .callscreen .cbar.six .cc.end { width: 46px; height: 46px; }
  .callscreen ~ .sheet-back { z-index: 60; }
  .auth { display: flex; flex-direction: column; height: 100%; overflow-y: auto; background: var(--bg); }
  .hero { padding: calc(30px + env(safe-area-inset-top)) 20px 14px; text-align: center; background: linear-gradient(180deg, var(--tint), transparent); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .hero h1 { margin: 6px 0 0; font-size: 30px; font-weight: 800; }
  .hero p { margin: 0; color: var(--muted); font-size: 15px; }
  .card { background: var(--surface); border-radius: 28px 28px 0 0; padding: 20px 22px calc(26px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; flex: 1; margin-top: 8px; box-shadow: 0 -4px 20px rgba(16,24,40,.06); }
  .tabs { display: flex; background: var(--surface2); border-radius: 14px; padding: 4px; }
  .tabs button { flex: 1; border: 0; background: none; padding: 10px; border-radius: 11px; font-size: 15px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .tabs button.on { background: var(--surface); color: var(--p); box-shadow: var(--shadow); }
  .card input[type=text], .card input[type=email], .card input[type=password], .profile input[type=text] { padding: 14px 15px; border: 1px solid var(--line); border-radius: 13px; font-size: 16px; outline: none; width: 100%; background: var(--bg); }
  .card input:focus, .profile input:focus { border-color: var(--p); box-shadow: 0 0 0 3px var(--tint); }
  .cta { border: 0; border-radius: 14px; padding: 14px; font-size: 17px; font-weight: 700; color: #fff; background: var(--grad); cursor: pointer; box-shadow: 0 8px 18px rgba(14,165,233,.28); }
  .cta:disabled { opacity: .6; }
  .link { background: none; border: 0; color: var(--p); font-size: 14px; cursor: pointer; padding: 4px; font-weight: 500; }
  .err { color: var(--danger); font-size: 14px; line-height: 1.6; }
  .err.ok { color: #16a34a; }

  /* settings / profile */
  .page { flex: 1; overflow-y: auto; padding: 6px 0 calc(30px + env(safe-area-inset-bottom) + var(--badge)); }
  .sgroup { background: var(--surface); border-radius: 18px; margin: 12px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .stitle { margin: 16px 18px 0; font-size: 13px; color: var(--muted); font-weight: 700; }
  .srow { display: flex; align-items: center; gap: 13px; padding: 13px 14px; cursor: pointer; border-bottom: 1px solid var(--line); background: var(--surface); }
  .srow:last-child { border-bottom: 0; }
  .srow:active { background: var(--surface2); }

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;

async function fetchFileBlob(chatRef, msgId, f, onProgress, key) {

    const s = await getDoc(doc(chatRef, 'messages', msgId + '_' + i));
    if (!s.exists() || !s.data().data) throw new Error('الملف غير متوفر (حُذف أو لم يكتمل رفعه)');
    if (f.enc) {
      if (!key) throw new Error('تعذّر فك تشفير الملف على هذا الجهاز');
      parts[i] = await aesDecBytes(key, s.data().data);

/* تجهيز مفاتيح هذا الحساب على هذا الجهاز (userData=null يعني تعذّر قراءة الحساب، فلا نُنشئ مفاتيح جديدة) */
async function setupKeys(u, userData, password) {
  myKeys = null;
  if (!subtle) return;
  try {
    const lsKey = 'mc_kp_' + u.uid;
    let local = null;
    try { local = JSON.parse(getStored(lsKey) || 'null'); } catch (_) {}
    const use = async (privJwk, pubStr) => {
      myKeys = { priv: await subtle.importKey('jwk', privJwk, ECDH, false, ['deriveKey']), pub: pubStr };
      pubCache.set(u.uid, pubStr);
    };
    if (userData === null) {            // بدون اتصال: استخدم النسخة المحلية فقط
      if (local && local.priv && local.pub) await use(local.priv, local.pub);
      return;
    }
    const pubStr = userData.pub || null;
    let pubJ = null;
    try { pubJ = pubStr ? JSON.parse(pubStr) : null; } catch (_) {}
    if (local && local.priv && pubJ && sameKey(pubJ, local.priv)) { await use(local.priv, pubStr); return; }
    if (userData.kb && password && pubJ) {      // جهاز جديد: استعد المفتاح من النسخة الاحتياطية المحمية بكلمة المرور
      try {
        const pr = await unwrapPriv(userData.kb, password);
        if (sameKey(pubJ, pr)) { setStored(lsKey, JSON.stringify({ priv: pr, pub: pubStr })); await use(pr, pubStr); return; }
      } catch (_) {}
    }
    const kp = await genKeyPair();          // لا مفاتيح صالحة: أنشئ مفاتيح جديدة
    const newPub = JSON.stringify(kp.pubJwk);
    await setDoc(doc(db, 'users', u.uid), { pub: newPub }, { merge: true });
    if (password) await setDoc(doc(db, 'users', u.uid, 'private', 'data'), { kb: await wrapPriv(kp.privJwk, password) }, { merge: true });
    else await setDoc(doc(db, 'users', u.uid, 'private', 'data'), { kb: deleteField() }, { merge: true }).catch(() => {});
    setStored(lsKey, JSON.stringify({ priv: kp.privJwk, pub: newPub }));
    await use(kp.privJwk, newPub);

function tuneSdp(sdp) {
  try {
    const m = /a=rtpmap:(\d+) opus\/48000\/2/.exec(sdp);
    if (!m) return sdp;
    const pt = m[1];
    const re = new RegExp('a=fmtp:' + pt + ' ([^\\r\\n]*)');
    return sdp.replace(re, (all, params) => {
      const ps = params.split(';').filter(Boolean);
      const have = new Set(ps.map(p => p.split('=')[0]));
      ['usedtx=1', 'useinbandfec=1', 'maxaveragebitrate=24000', 'stereo=0'].forEach(x => { if (!have.has(x.split('=')[0])) ps.push(x); });
      return 'a=fmtp:' + pt + ' ' + ps.join(';');
    });
  } catch (_) { return sdp; }
}

/* مراقبة جودة الشبكة: إيقاف الفيديو تلقائياً عند الضعف للحفاظ على الصوت */
function startMonitor(c) {

    if (c.ended || !c.pc) return;
    try {
      const stats = await c.pc.getStats();
      let lost = 0, recv = 0, rtt = null;
      stats.forEach(r => {
        if (r.type === 'inbound-rtp' && (r.kind === 'audio' || r.mediaType === 'audio')) { lost = r.packetsLost || 0; recv = r.packetsReceived || 0; }

function makePeer(c, onLocalIce, servers) {

async function getMedia(kind) {

    return null;

    : false;
  try {
    return await navigator.mediaDevices.getUserMedia({ audio, video });
  } catch (e) {
    try { if (kind === 'video') return await navigator.mediaDevices.getUserMedia({ audio: true, video: true }); } catch (_) {}

    else if (nm === 'NotFoundError') msg = 'لا يوجد ميكروفون' + (kind === 'video' ? ' أو كاميرا' : '') + ' في هذا الجهاز.';
    else if (nm === 'NotReadableError') msg = 'الميكروفون مستخدم من تطبيق آخر. أغلقه ثم أعد المحاولة.';

  }

async function startCall(otherUid, otherName, otherPhoto, kind) {
  if (activeCall) { toast('أنت في مكالمة بالفعل'); return; }
  if (isBlocked(otherUid)) { toast('لقد حظرت هذا المستخدم. ألغِ الحظر أولاً'); return; }
  const stream = await getMedia(kind);
  if (!stream) return;
  nativeCall(true);
  const chatRef = doc(db, 'chats', chatIdFor(me.uid, otherUid));
  const callRef = doc(chatRef, 'messages', 'call_current');
  const id = String(Date.now());
  const c = {
    id, role: 'caller', kind, other: otherUid, name: otherName, photo: otherPhoto,
    chatRef, callRef, localStream: stream, ended: false, seenIce: 0, iceQueue: [], remoteReady: false,
    created: false, pendingIce: [], restarts: 0
  };
  activeCall = c;
  c.ui = buildCallUI(c);
  wireControls(c);
  c.ui.status.textContent = 'جارٍ الاتصال…';
  c.stopRing = startRing('out');
  try {
    const ice = await getIceServers();
    c.hasTurn = ice.turn;
    const pc = makePeer(c, s => {
      if (c.created) updateDoc(callRef, { callerIce: arrayUnion(s) }).catch(() => {});
      else c.pendingIce.push(s);
    }, ice.servers);
    const offer = await pc.createOffer();
    offer.sdp = tuneSdp(offer.sdp);
    await pc.setLocalDescription(offer);
    await setDoc(callRef, {
      senderId: me.uid, id, callerId: me.uid, calleeId: otherUid, kind, state: 'ringing',
      offer: { type: offer.type, sdp: offer.sdp }, callerIce: [], calleeIce: []
    });
    await setDoc(chatRef, {
      participants: [me.uid, otherUid],
      call: { id, from: me.uid, to: otherUid, kind, state: 'ringing', at: serverTimestamp() }
    }, { merge: true });
    c.created = true;
    c.pendingIce.splice(0).forEach(s => updateDoc(callRef, { callerIce: arrayUnion(s) }).catch(() => {}));
    c.ui.status.textContent = 'يرن…';
    c.unsub = onSnapshot(callRef, snap => {
      const d = snap.data();
      if (!d || d.id !== id || c.ended) return;
      if (d.answer && !pc.remoteDescription) {
        pc.setRemoteDescription(d.answer).then(() => { c.remoteReady = true; drainIce(c); tuneSenders(c); }).catch(() => {});
      } else if (d.answer && d.answerRestart && d.answerRestart === c.restarts && c.restarting) {
        c.restarting = false;
        pc.setRemoteDescription(d.answer).catch(() => {});
      }
      ingestIce(c, d.calleeIce || []);
      if (d.yt !== undefined) ytRemote(c, d.yt);
      if (d.state === 'accepted' && !c.connectedAt) {
        if (c.stopRing) { c.stopRing(); c.stopRing = null; }
        clearTimeout(c.timeout);
        c.ui.status.textContent = 'جارٍ التوصيل…';
        armConnTimeout(c);
      }
      if (d.state === 'declined') { toast('تم رفض المكالمة'); finish(c, 'declined'); }
      else if (d.state === 'ended' || d.state === 'missed') finish(c, 'ended');
    });
    c.timeout = setTimeout(() => { if (!c.connectedAt) { toast('لا يوجد رد'); endCall(c, 'missed'); } }, CALL_RING_MS);
  } catch (e) {
    toast('تعذّر بدء المكالمة: ' + (e.code || e.message || ''), 6000);
    finish(c, 'ended');
  }
}

async function handleRestart(c, dd) {
  try {
    await c.pc.setRemoteDescription(dd.offer);
    const a = await c.pc.createAnswer();
    a.sdp = tuneSdp(a.sdp);
    await c.pc.setLocalDescription(a);
    await updateDoc(c.callRef, { answer: { type: a.type, sdp: a.sdp }, answerRestart: dd.restart });

}
async function answerCall(info) {
  if (activeCall) return;
  const stream = await getMedia(info.kind);
  const chatRef = doc(db, 'chats', info.chatId);
  const callRef = doc(chatRef, 'messages', 'call_current');
  if (!stream) {
    updateDoc(callRef, { state: 'declined' }).catch(() => {});
    updateDoc(chatRef, { 'call.state': 'declined' }).catch(() => {});
    return;
  }
  nativeCall(true);
  let c;
  try {
    const snap = await getDoc(callRef);
    const d = snap.exists() ? snap.data() : null;
    if (!d || d.id !== info.id || d.state !== 'ringing') {
      stream.getTracks().forEach(t => t.stop());
      nativeCall(false);
      toast('انتهت المكالمة');
      return;
    }
    c = {
      id: info.id, role: 'callee', kind: info.kind, other: info.other, name: info.name, photo: info.photo,
      chatRef, callRef, localStream: stream, ended: false, seenIce: 0, iceQueue: [], remoteReady: false, lastRestart: 0
    };
    activeCall = c;
    c.ui = buildCallUI(c);
    wireControls(c);
    c.ui.status.textContent = 'جارٍ التوصيل…';
    const ice = await getIceServers();
    c.hasTurn = ice.turn;
    const pc = makePeer(c, s => updateDoc(callRef, { calleeIce: arrayUnion(s) }).catch(() => {}), ice.servers);
    await pc.setRemoteDescription(d.offer);
    c.remoteReady = true;
    const ans = await pc.createAnswer();
    ans.sdp = tuneSdp(ans.sdp);
    await pc.setLocalDescription(ans);
    await updateDoc(callRef, { answer: { type: ans.type, sdp: ans.sdp }, state: 'accepted' });
    updateDoc(chatRef, { 'call.state': 'accepted' }).catch(() => {});
    ingestIce(c, d.callerIce || []);
    drainIce(c);
    tuneSenders(c);
    armConnTimeout(c);
    c.unsub = onSnapshot(callRef, sn => {
      const dd = sn.data();
      if (!dd || dd.id !== c.id || c.ended) return;
      ingestIce(c, dd.callerIce || []);
      if (dd.yt !== undefined) ytRemote(c, dd.yt);
      if (dd.restart && dd.restart > c.lastRestart && dd.offer) { c.lastRestart = dd.restart; handleRestart(c, dd); }
      if (dd.state === 'ended' || dd.state === 'missed' || dd.state === 'declined') finish(c, 'ended');
    });
  } catch (e) {
    toast('تعذّر قبول المكالمة: ' + (e.code || e.message || ''), 6000);
    if (c) finish(c, 'ended'); else stream.getTracks().forEach(t => t.stop());
  }
}

/* فحص المكالمات: يحدد سبب عدم عملها */
function gatherIce(servers) {
  return new Promise(res => {
    let stun = false, relay = false, fin = false;

    const done = () => {
      if (fin) return;

      clearTimeout(t);
      try { if (pc) pc.close(); } catch (_) {}

    };
    const t = setTimeout(done, 7000);
    try {
      pc = new RTCPeerConnection({ iceServers: servers });
      pc.createDataChannel('x');
      pc.onicecandidate = ev => {
        if (!ev.candidate) { done(); return; }
        const c = ev.candidate.candidate || '';
        if (c.indexOf(' typ srflx') > -1) stun = true;
        if (c.indexOf(' typ relay') > -1) relay = true;
      };
      pc.createOffer().then(o => pc.setLocalDescription(o)).catch(done);
    } catch (_) { done(); }
  });
}

/* ---------- المراقبة العامة للمحادثات (مكالمات + إشعارات رسائل) ---------- */
let watchUnsub = null, userUnsub = null;
let chatsCache = [], chatsLoaded = false, chatsInit = true, openChatUid = null;
const chatsSubs = new Set();
const seenLast = new Map();
function stopWatch() {
  if (watchUnsub) { watchUnsub(); watchUnsub = null; }
  if (userUnsub) { userUnsub(); userUnsub = null; }
}
function updateTitle() {
  let total = 0;
  chatsCache.forEach(c => { if (!isBlocked(otherOf(c))) total += (c.unread && c.unread[me.uid]) || 0; });
  document.title = total ? '(' + total + ') Mahmoud chat' : 'Mahmoud chat';
}
let swReg = null;
async function sysNotify(title, body, hash, tag) {
  try {
    if (window.NativeBridge && window.NativeBridge.notifyMsg) { window.NativeBridge.notifyMsg(title, body, hash); return true; }
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return false;
    const opts = { body, icon: APP_ICON, badge: APP_ICON, tag, lang: 'ar', dir: 'rtl', data: { hash } };
    if (swReg && swReg.showNotification) { await swReg.showNotification(title, opts); return true; }
    const n = new Notification(title, opts);
    n.onclick = () => { try { window.focus(); } catch (_) {} location.hash = hash; n.close(); };
    return true;
  } catch (_) { return false; }
}
async function notifyMessage(c, other) {
  const name = (c.names && c.names[other]) || '';
  const photo = (c.photos && c.photos[other]) || '';
  const text = await previewAsync(c);
  const hash = 'chat/' + other + '/' + encodeURIComponent(name);
  soundRecv();
  if (document.hidden) await sysNotify(name, text, hash, 'c_' + c.id);
  else showBanner(name, text, photo, () => { location.hash = hash; });
}
function handleCall(c) {
  const cl = c.call;
  if (!cl) return;
  if (incomingUI && incomingUI.info.id === cl.id && cl.state !== 'ringing') { dismissIncoming(); return; }
  const age = cl.at ? Date.now() - ms(cl.at) : 1e9;
  const fresh = age < 90000 && age > -120000;
  if (cl.state === 'ringing' && cl.from !== me.uid && fresh && !activeCall && !incomingUI && cl.id !== lastIncomingId && !isBlocked(cl.from) && chatAccepted(c)) {
    lastIncomingId = cl.id;
    showIncoming({
      chatId: c.id, id: cl.id, other: cl.from, kind: cl.kind,
      name: (c.names && c.names[cl.from]) || '',
      photo: (c.photos && c.photos[cl.from]) || ''
    });
  }
}
function handleMsg(c, snap) {
  const lt = ms(c.lastTime);
  const prev = seenLast.get(c.id);
  seenLast.set(c.id, lt);
  if (chatsInit || !c.lastSender || c.lastSender === me.uid) return;
  if (lt <= (prev || 0) || snap.metadata.fromCache) return;
  const other = otherOf(c);
  if (isBlocked(other) || !notifOn()) return;
  if (openChatUid === other && !document.hidden) return;
  notifyMessage(c, other);
}
function watchGlobal() {
  stopWatch();
  chatsLoaded = false; chatsInit = true; seenLast.clear(); chatsCache = [];
  const q = query(collection(db, 'chats'), where('participants', 'array-contains', me.uid));
  watchUnsub = onSnapshot(q, snap => {
    chatsCache = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
    chatsLoaded = true;
    chatsCache.forEach(c => { handleCall(c); handleMsg(c, snap); });
    chatsInit = false;
    updateTitle();
    chatsSubs.forEach(f => f());
  }, () => {});
  userUnsub = onSnapshot(doc(db, 'users', me.uid), s => {
    const d = s.exists() ? s.data() : {};
    blockedSet = new Set(d.blocked || []);
    if (s.exists() && !d.deleted) profile = { ...profile, name: d.name || profile.name, photo: d.photo || '', first: d.first || '', last: d.last || '', gender: d.gender || '', incomplete: !!profile.incomplete && !(d.first && d.last && d.gender) };
    saveAccount();
    updateTitle();
    chatsSubs.forEach(f => f());
  }, () => {});
}

/* التقاط صورة من الكاميرا (للملف الشخصي وغيره) مع زر قلب الكاميرا */
function captureCamera(facing = 'user') {
  return new Promise(async (resolve) => {
    const open = (f) => navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: f } }, audio: false });
    let stream;
    try { stream = await open(facing); }
    catch (e) { toast('تعذّر فتح الكاميرا: ' + (e.message || e.name || '')); resolve(null); return; }
    const video = document.createElement('video');
    video.autoplay = true; video.muted = true; video.setAttribute('playsinline', '');
    video.srcObject = stream;
    video.style.cssText = 'width:100%;height:100%;object-fit:contain';
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column';
    const wrap = document.createElement('div');
    wrap.style.cssText = 'flex:1;min-height:0';
    wrap.append(video);
    const bar = document.createElement('div');
    bar.style.cssText = 'display:flex;justify-content:space-around;align-items:center;padding:16px;background:#000';
    const stop = (res) => { stream.getTracks().forEach(t => t.stop()); box.remove(); resolve(res || null); };
    const btn = (txt, fn) => { const b = document.createElement('button'); b.textContent = txt; b.style.cssText = 'font-size:30px;border:0;background:none;color:#fff;padding:8px 20px'; b.onclick = fn; return b; };
    let cur = facing;
    const flip = async () => {
      const prev = cur, next = prev === 'user' ? 'environment' : 'user';
      stream.getTracks().forEach(t => t.stop());
      try { stream = await open(next); cur = next; }
      catch (_) { try { stream = await open(prev); } catch (e) { toast('تعذّر تبديل الكاميرا'); } }
      video.srcObject = stream;
    };
    bar.append(
      btn('✕', () => stop(null)),
      btn('🔄', flip),
      btn('📸', () => {
        if (!video.videoWidth) return;
        const c = document.createElement('canvas');
        c.width = video.videoWidth; c.height = video.videoHeight;
        c.getContext('2d').drawImage(video, 0, 0);
        c.toBlob(b => stop(b ? new File([b], 'camera.jpg', { type: 'image/jpeg' }) : null), 'image/jpeg', 0.9);
      }));
    box.append(wrap, bar);
    document.body.append(box);
  });
}

    (type.startsWith('video/') ? 'فيديو: ' : 'ملف: ') + name);

      const f = m.file;
      const getVidBlob = async (cb) => fetchFileBlob(chatRef, m.id, f, cb, f.enc ? await chatKey(otherUid) : null);
      const vw = h('div', { class: 'vwrap' });
      const showVideo = (blob, autoplay) => {
        let url = vidCache.get(m.id);
        if (!url) { url = URL.createObjectURL(blob); vidCache.set(m.id, url); vidBlobs.set(m.id, blob); }
        const v = h('video', { src: url, controls: '', playsinline: '', preload: 'auto' });
        v.addEventListener('loadedmetadata', () => { if (box.dataset.stick === '1') box.scrollTop = box.scrollHeight; });
        const fs = h('button', { class: 'vfs', title: 'تكبير' }, ico('maximize', 18));
        fs.addEventListener('click', ev => {
          ev.stopPropagation();
          try { v.pause(); } catch (_) {}
          openViewer({ name: f.name, type: f.type, getBlob: async () => vidBlobs.get(m.id) });
        });
        vw.replaceChildren(v, fs);
        if (autoplay) v.play().catch(() => {});
      };
      const ph = h('div', { class: 'vph' },
        h('div', { class: 'pbtn' }, ico('play', 30)),
        h('div', { class: 'vsz' }, fmtSize(f.size)));
      vw.append(ph);
      let loading = false;
      ph.addEventListener('click', async ev => {
        ev.stopPropagation();
        if (loading) return;
        loading = true;
        const label = ph.querySelector('.vsz');
        try {
          const blob = await getVidBlob((d, t) => { label.textContent = 'جارٍ التحميل ' + d + '/' + t; });
          showVideo(blob, true);
        } catch (e) {
          label.textContent = e.message || 'تعذّر التحميل';
          loading = false;
        }
      });
      vw.addEventListener('click', ev => ev.stopPropagation());
      if (vidBlobs.has(m.id)) showVideo(vidBlobs.get(m.id), false);
      fl = vw;
    } else if (m.file) {
      const f = m.file;
      fl = h('div', { class: 'fcard' },
        h('div', { class: 'ficon' }, ico(fileIconName(f.type), 22)),
        h('div', { class: 'finfo' },
          h('div', { class: 'fname' }, f.name),
          h('div', { class: 'fsize' }, fmtSize(f.size) + ' · اضغط للفتح')));
      fl.addEventListener('click', ev => {
        ev.stopPropagation();
        onTap(() => openViewer({
          name: f.name, type: f.type,
          getBlob: async (cb) => fetchFileBlob(chatRef, m.id, f, cb, f.enc ? await chatKey(otherUid) : null)
        }));
      });
    }
    const big = !m.image && !m.file && !m.fwd && EMOJI_ONLY.test((m.text || '').trim());
    const rxList = m.reactions ? Object.values(m.reactions) : [];
    const rxEl = rxList.length ? h('div', { class: 'rx', onclick: ev => { ev.stopPropagation(); showReactors(m); } },
      [...new Set(rxList)].slice(0, 3).join(''),
      rxList.length > 1 ? h('span', { class: 'rxn' }, String(rxList.length)) : null) : null;
    const addBtn = (!m.fwd && !m.pending) ? h('button', { class: 'radd', title: 'تفاعل', onclick: ev => { ev.stopPropagation(); openReactBar(m, ev.currentTarget); } }, ico('smile', 18)) : null;
    const strip = (rxEl || addBtn) ? h('div', { class: 'rstrip' }, rxEl, addBtn) : null;
    const el = h('div', { class: 'bubble ' + (mine ? 'mine' : 'other') + (big ? ' big' : '') + (isVid ? ' vid' : '') + (m.fwd ? ' fwdb' : '') + (m.fnote ? ' fnote' : '') + (strip ? ' hasr' : '') },
      m.fwd ? h('div', { class: 'fwdtag' }, ico('forward', 12), 'معاد توجيهها') : null,
      img, fl,
      m.text ? h('div', {}, linkify(m.text)) : null,
      h('div', { class: 't' }, m.edited ? h('span', { class: 'ed' }, 'معدّلة') : null, h('span', {}, hhmm(t)), mine ? ticks(m) : null),
      strip);
    el.addEventListener('click', () => onTap(null));
    onLongPress(el, () => messageMenu(m));
    return el;
  }
  function render() {
    if (!loaded) return;
    const vis = docsCache.filter(m => ms(m.time) > cleared && !(blockedNow && m.senderId === otherUid));
    const stick = box.dataset.stick === '1';
    const els = [more];
    more.style.display = hasMore ? '' : 'none';
    if (encOn) els.push(encNote);
    if (!vis.length) els.push(empty);
    const keep = new Set();
    for (const m of vis) {
      const sig = [m.fwd ? 1 : 0, m.fnote ? 1 : 0, m.edited ? 1 : 0, m.deleted ? 1 : 0, m.undecryptable ? 1 : 0, m.read ? 1 : 0, m.pending ? 1 : 0, m.text || '', m.image ? 1 : 0, m.file ? m.file.name : '', ms(m.time), m.reactions ? JSON.stringify(m.reactions) : ''].join('|');
      let n = nodes.get(m.id);
      if (!n || n.sig !== sig) { n = { el: bubble(m), sig }; nodes.set(m.id, n); }
      keep.add(m.id);
      els.push(n.el);
    }
    for (const id of [...nodes.keys()]) if (!keep.has(id)) nodes.delete(id);
    let cursor = box.firstChild;
    for (const el of els) {
      if (el === cursor) cursor = cursor.nextSibling;
      else box.insertBefore(el, cursor);
    }
    while (cursor) { const nx = cursor.nextSibling; cursor.remove(); cursor = nx; }
    const lastM = vis[vis.length - 1];
    if (restoreH) { box.scrollTop = box.scrollHeight - restoreH; restoreH = 0; }
    else if (first || stick || (lastM && lastM.senderId === me.uid)) { box.scrollTop = box.scrollHeight; box.dataset.stick = '1'; first = false; }
  }
  function subscribe() {
    if (unsub) unsub();
    const q = query(collection(chatRef, 'messages'), orderBy('time', 'desc'), limit(lim));
    unsub = onSnapshot(q, { includeMetadataChanges: true }, async snap => {
      const mySeq = ++snapSeq;
      const raw = snap.docs.map(d => ({ id: d.id, pending: d.metadata.hasPendingWrites, ...d.data({ serverTimestamps: 'estimate' }) })).reverse();
      const dec = await Promise.all(raw.map(m => openMessage(otherUid, m)));
      if (dead || mySeq !== snapSeq) return;
      docsCache = dec;
      loaded = true;
      hasMore = snap.docs.length >= lim;
      render();
      const last = docsCache[docsCache.length - 1];
      if (snapFirst) { lastId = last ? last.id : null; snapFirst = false; }
      else if (last && last.id !== lastId) {
        lastId = last.id;
        if (last.senderId !== me.uid && !snap.metadata.fromCache && !blockedNow) { typingUntil = 0; updateSub(); soundRecv(); }
      }
      if (docsCache.some(m => m.senderId === otherUid && m.read === false)) markRead();
    }, async err => {
      if (err && err.code === 'permission-denied' && !retried) {
        retried = true;
        await ensureP;
        if (!dead) subscribe();
      } else {
        box.replaceChildren(h('div', { class: 'empty' }, 'خطأ: ' + (err && err.message)));
      }
    });
  }
  function loadMore() {
    restoreH = box.scrollHeight;
    lim += 40;
    subscribe();
  }
  cleanup.push(onSnapshot(chatRef, snap => {
    const d = snap.data({ serverTimestamps: 'estimate' }) || {};
    chatState = d;
    if (!chatLoaded) { chatLoaded = true; chatReadyRes(); }
    applyBlocked();
    const c = clearedOf(d);
    if (c !== cleared) { cleared = c; render(); }
    const n = d.tp && d.tp[otherUid];
    if (chatSnapSeen && n !== undefined && n !== lastTp && !blockedNow) showTyping();
    lastTp = n === undefined ? null : n;
    chatSnapSeen = true;
  }, () => {}));
  subscribe();

  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; syncSend(); if (hasText) pingTyping(); });
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.shiftKey && matchMedia('(pointer:fine)').matches) { ev.preventDefault(); sendText(); }
  });
  sendBtn.addEventListener('click', sendText);

  const blockBar = h('div', { class: 'blockbar' },
    h('div', {}, 'لقد حظرت هذا المستخدم. لن تصلك رسائله ولا مكالماته.'),
    h('button', { class: 'btn', onclick: () => setBlocked(otherUid, false) }, 'إلغاء الحظر'));
  const composer = h('div', { class: 'composer' },
    h('div', { class: 'pill' },
      h('button', { class: 'cb emo', title: 'رموز تعبيرية', onclick: () => openEmojiPicker(insertEmoji, true) }, ico('smile', 24)),
      input,
      h('button', { class: 'cb clipb', title: 'إرفاق', onclick: openSheet }, ico('clip', 24)),
      h('button', { class: 'cb extra', title: 'كاميرا', onclick: openCamera }, ico('camera', 24))),
    sendBtn);
  /* ---- طلب المراسلة: قبول / رفض / حظر ---- */
  const reqBar = h('div', { class: 'reqbar' });
  function reqView() {
    const st = chatState.reqStatus;
    if (!st || st === 'accepted') return null;
    if (st === 'pending') {
      if (chatState.reqBy !== me.uid) return 'incoming';
      return (chatState.lastSender === me.uid && chatState.lastMessage != null) ? 'waiting' : null;
    }
    if (st === 'rejected') return chatState.reqBy === me.uid ? 'rejected-sent' : 'rejected-mine';
    return null;
  }
  async function reqAccept() {
    try {
      const bb = writeBatch(db);
      bb.set(chatRef, { reqStatus: 'accepted' }, { merge: true });
      bb.set(doc(db, 'users', me.uid), { hiddenFrom: arrayRemove(otherUid) }, { merge: true });
      await bb.commit();
      toast('تم قبول المراسلة');
    } catch (e) { toast('تعذّر التنفيذ: ' + e.message, 4000); }
  }
  async function reqReject() {
    if (!confirm('رفض طلب المراسلة؟ لن تظهر لهذا الشخص في البحث بعد الآن.')) return;
    try {
      const bb = writeBatch(db);
      bb.set(chatRef, { reqStatus: 'rejected' }, { merge: true });
      bb.set(doc(db, 'users', me.uid), { hiddenFrom: arrayUnion(otherUid) }, { merge: true });
      await bb.commit();
      toast('تم رفض الطلب');
      location.hash = '';
    } catch (e) { toast('تعذّر التنفيذ: ' + e.message, 4000); }
  }
  async function reqBlock() {
    if (!confirm('حظر ' + (title.textContent || otherName) + '؟ لن تصلك رسائله ولا مكالماته.')) return;
    try {
      const bb = writeBatch(db);
      bb.set(chatRef, { reqStatus: 'rejected' }, { merge: true });
      bb.set(doc(db, 'users', me.uid), { blocked: arrayUnion(otherUid), hiddenFrom: arrayUnion(otherUid) }, { merge: true });
      await bb.commit();
      toast('تم حظر المستخدم');
      location.hash = '';
    } catch (e) { toast('تعذّر التنفيذ: ' + e.message, 4000); }
  }
  function paintReq(kind) {
    const nm = title.textContent || otherName;
    if (kind === 'incoming') {
      reqBar.replaceChildren(
        h('div', {}, nm + ' يرغب بمراسلتك. اطّلع على رسالته ثم قرّر:'),
        h('div', { class: 'reqbtns' },
          h('button', { class: 'ok', onclick: reqAccept }, 'قبول'),
          h('button', { onclick: reqReject }, 'رفض'),
          h('button', { class: 'no', onclick: reqBlock }, 'حظر')));
    } else if (kind === 'waiting') {
      reqBar.replaceChildren(h('div', {}, 'تم إرسال طلب المراسلة. ستتمكن من المتابعة بعد أن يقبل ' + nm + ' طلبك.'));
    } else if (kind === 'rejected-sent') {
      reqBar.replaceChildren(h('div', {}, 'تم رفض طلب المراسلة.'));
    } else {
      reqBar.replaceChildren(h('div', {}, 'رفضت هذا الطلب.'), h('div', { class: 'reqbtns' }, h('button', { class: 'ok', onclick: reqAccept }, 'قبول المراسلة')));
    }
  }
  function applyBlocked() {
    const rv = blockedNow ? null : reqView();
    blockBar.style.display = blockedNow ? 'flex' : 'none';
    reqBar.style.display = rv ? 'flex' : 'none';
    if (rv) paintReq(rv);
    composer.style.display = (blockedNow || rv) ? 'none' : 'flex';
  }
  const onB = () => { const nb = isBlocked(otherUid); if (nb !== blockedNow) { blockedNow = nb; applyBlocked(); render(); } };
  chatsSubs.add(onB);
  cleanup.push(() => chatsSubs.delete(onB));
  applyBlocked();

  return h('div', { class: 'screen' },
    h('header', { class: 'top' },
      iconBtn('back', 'رجوع', () => history.back()),
      hdrWrap,
      h('div', { class: 'htwrap' }, title, sub),
      iconBtn('phone', 'اتصال صوتي', () => { if (!chatAccepted(chatState)) { toast('ستتمكن من الاتصال بعد قبول المراسلة'); return; } startCall(otherUid, title.textContent, curPhoto, 'audio'); }, 'ib acc'),
      iconBtn('video', 'اتصال مرئي', () => { if (!chatAccepted(chatState)) { toast('ستتمكن من الاتصال بعد قبول المراسلة'); return; } startCall(otherUid, title.textContent, curPhoto, 'video'); }, 'ib acc'),
      iconBtn('more', 'المزيد', chatMenu)),
    box, blockBar, reqBar, composer);
}

/* ---------- التوجيه ---------- */
function route() {
  clear();
  if (me === undefined) return;
  if (!me) { show(authView()); return; }
  if (profile.incomplete) { show(completeProfileView()); return; }
  const [p, a, b] = location.hash.slice(1).split('/');
  if (p === 'search' || p === 'members') show(searchView());
  else if (p === 'settings') show(settingsView());
  else if (p === 'profile') show(profileView());
  else if (p === 'blocked') show(blockedView());
  else if (p === 'requests') show(requestsView());
  else if (p === 'chat' && a) show(chatView(a, decodeURIComponent(b || '')));
  else show(homeView());
}
function withTimeout(p, t) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), t))]); }
async function unregisterPush() {
  try {
    if (!window.NativeBridge || !window.NativeBridge.getFcmToken || !me) return;
    const t = window.NativeBridge.getFcmToken();
    if (t) await withTimeout(setDoc(doc(db, 'fcmTokens', me.uid), { tokens: arrayRemove(t) }, { merge: true }), 4000);
  } catch (_) {}
}
async function signOutClean() { await unregisterPush(); try { await withTimeout(setDoc(doc(db, 'users', me.uid), { on: false, seen: serverTimestamp() }, { merge: true }), 3000); } catch (_) {} return signOut(auth); }
function registerPush() {
  if (!window.NativeBridge || !window.NativeBridge.getFcmToken) return;
  const save = t => { if (t && me) setDoc(doc(db, 'fcmTokens', me.uid), { tokens: arrayUnion(t) }, { merge: true }).catch(() => {}); };
  window.__onFcmToken = save;
  try { save(window.NativeBridge.getFcmToken()); } catch (_) {}
  try { if (window.NativeBridge.setMsgNotifications) window.NativeBridge.setMsgNotifications(notifOn()); } catch (_) {}
}
function startSession() { if (me) { startPresence(); watchGlobal(); registerPush(); getIceServers().catch(() => {}); } }
app.replaceChildren(h('div', { class: 'splash' }, logoSVG(96)));
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => {});
  navigator.serviceWorker.addEventListener('message', ev => { if (ev.data && typeof ev.data.hash === 'string') location.hash = ev.data.hash; });
}
onAuthStateChanged(auth, async u => {
  me = u;
  if (u) {
    const pw = authState.pw;
    authState.pw = '';
    let d = null, fetched = false;
    try {
      const sn = await withTimeout(getDoc(doc(db, 'users', u.uid)), 8000);
      d = sn.exists() ? sn.data() : {};
      if (d.kb) {
        // حساب قديم: ما زالت نسخة المفتاح في الملف العام من قبل هذا التحديث.
        // انسخها أولاً إلى المكان الآمن الجديد، ولا تُحذف من مكانها القديم إلا بعد التأكد من نجاح النسخ،
        // حتى لا تضيع النسخة الوحيدة من المفتاح إن فشل الاتصال في منتصف العملية.
        try {
          await setDoc(doc(db, 'users', u.uid, 'private', 'data'), { kb: d.kb }, { merge: true });
          await updateDoc(doc(db, 'users', u.uid), { kb: deleteField() });
        } catch (_) { /* فشل الترحيل: اترك kb في مكانه القديم لمحاولة لاحقة، فهذا أفضل من فقدانه */ }
      } else {
        try { const ps = await withTimeout(getDoc(doc(db, 'users', u.uid, 'private', 'data')), 8000); if (ps.exists() && ps.data().kb) d.kb = ps.data().kb; } catch (_) {}
      }
      fetched = true;
    } catch (_) {}
    const pr = authState.pendingReg;
    if (pr) d = { ...(d || {}), ...pr };
    profile = {
      name: (d && d.name) || u.displayName || profile.name || '', photo: (d && d.photo) || '',
      first: (d && d.first) || '', last: (d && d.last) || '', gender: (d && d.gender) || '',
      incomplete: !!(fetched && d && !pr && !(d.first && d.last && d.gender))
    };
    if (fetched && d && !pr && d.first && d.last) {
      const sk = nameFields(d.first, d.last, d.gender).searchKey;
      if (d.searchKey !== sk) setDoc(doc(db, 'users', u.uid), { firstLower: normName(d.first), lastLower: normName(d.last), searchKey: sk }, { merge: true }).catch(() => {});
    }
    blockedSet = new Set((d && d.blocked) || []);
    if (d && (d.email || d.emailLower)) {
      updateDoc(doc(db, 'users', u.uid), { email: deleteField(), emailLower: deleteField() }).catch(() => {});
    }
    await setupKeys(u, fetched ? d : null, pw);
    saveAccount();
    startSession();
  } else {
    stopWatch();
    dismissIncoming();
    if (activeCall) finish(activeCall, 'ended');
    myKeys = null;
    profile = { name: '', photo: '' };
    blockedSet = new Set();
    chatsCache = [];
    document.title = 'Mahmoud chat';
    location.hash = '';
  }
  route();
});
addEventListener('hashchange', route);
/* تنبيه عند العودة للتطبيق إن وصلت رسائل أثناء غيابك */
/* إعادة وصل Firestore عند العودة للتطبيق (يمنع تجمّد الرسائل الفورية بعد الخلفية) */
let reconnecting = false, lastReconnect = 0;
async function reconnectNow() {
  if (reconnecting || !me) return;
  if (Date.now() - lastReconnect < 3000) return;
  reconnecting = true; lastReconnect = Date.now();
  try { await disableNetwork(db); await enableNetwork(db); } catch (_) {}
  reconnecting = false;
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) reconnectNow(); });
addEventListener('online', reconnectNow);
addEventListener('pageshow', () => reconnectNow());
/* فحص دوري كل 45 ثانية أثناء فتح التطبيق: إن لم يردّ الخادم نعيد الاتصال تلقائياً */
setInterval(async () => {
  if (!me || document.hidden || reconnecting) return;
  try { await withTimeout(getDocFromServer(doc(db, 'users', me.uid)), 8000); }
  catch (_) { lastReconnect = 0; reconnectNow(); }
}, 45000);
let unreadAtHide = null;
const totalUnread = () => chatsCache.reduce((n, c) => n + (isBlocked(otherOf(c)) ? 0 : ((c.unread && c.unread[me.uid]) || 0)), 0);
document.addEventListener('visibilitychange', () => {
  if (!me) return;
  if (document.hidden) { unreadAtHide = totalUnread(); return; }
  if (unreadAtHide === null) return;
  const before = unreadAtHide;
  unreadAtHide = null;
  setTimeout(() => {
    const diff = totalUnread() - before;
    if (diff > 0 && notifOn()) { soundRecv(); showBanner('رسائل جديدة', 'وصلتك ' + diff + ' رسالة أثناء غيابك', '', () => { location.hash = ''; }); }
  }, 1800);
});
/* فك قفل الصوت عند أول لمسة حتى تعمل الأصوات دائماً */
['pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, () => ac(), { passive: true }));
